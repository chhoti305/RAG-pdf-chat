<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat with your PDFs</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <main class="max-w-2xl mx-auto p-4">
    <h1 class="text-2xl font-semibold mb-4">Chat with your PDFs</h1>

    <section class="bg-white rounded-lg shadow p-4 mb-4">
      <input id="file" type="file" accept="application/pdf" class="text-sm" />
      <button onclick="upload()" class="ml-2 px-3 py-1 bg-blue-600 text-white rounded text-sm">Upload</button>
      <p id="status" class="text-sm text-gray-600 mt-2"></p>
    </section>

    <section class="bg-white rounded-lg shadow p-4">
      <div class="flex gap-2">
        <input id="q" class="flex-1 border rounded px-3 py-2 text-sm" placeholder="Ask a question about your documents"
               onkeydown="if(event.key==='Enter') ask()" />
        <button onclick="ask()" class="px-4 py-2 bg-blue-600 text-white rounded text-sm">Ask</button>
      </div>
      <div id="answer" class="mt-4 text-sm whitespace-pre-wrap"></div>
      <div id="meta" class="mt-2 text-xs text-gray-500"></div>
      <div id="sources" class="mt-3 space-y-2"></div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    async function upload() {
      const f = $("file").files[0];
      if (!f) return;
      $("status").textContent = "Uploading and indexing...";
      const body = new FormData();
      body.append("file", f);
      const res = await fetch("/upload", { method: "POST", body });
      const data = await res.json();
      $("status").textContent = res.ok
        ? `Indexed ${data.file} (${data.chunks_stored} chunks)`
        : `Error: ${data.detail}`;
    }

    async function ask() {
      const question = $("q").value.trim();
      if (!question) return;
      $("answer").textContent = "Thinking...";
      $("meta").textContent = "";
      $("sources").innerHTML = "";
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();
      if (!res.ok) { $("answer").textContent = "Error: " + data.detail; return; }
      $("answer").textContent = data.answer;
      $("meta").textContent =
        `Retrieval ${data.latency_ms.retrieval} ms | Generation ${data.latency_ms.generation} ms`;
      data.sources.forEach((s) => {
        const d = document.createElement("div");
        d.className = "border rounded p-2 bg-gray-50 text-xs";
        const head = document.createElement("div");
        head.className = "font-medium mb-1";
        head.textContent = `${s.source} - page ${s.page} (similarity ${s.score})`;
        const body = document.createElement("div");
        body.textContent = s.text;
        d.append(head, body);
        $("sources").appendChild(d);
      });
    }
  </script>
</body>
</html>
